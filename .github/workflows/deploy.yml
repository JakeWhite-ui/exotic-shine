name: Deploy to GitHub Pages

# Pages can only serve files, so the Next.js build has to happen here rather
# than in the repo. Push to main and this produces `out/` and publishes it —
# same feel as committing a plain index.html, just with a build step in front.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # Set this in Settings → Secrets and variables → Actions → Variables.
          # Without it the enquiry form falls back to pointing people at
          # WhatsApp instead of silently dropping messages.
          NEXT_PUBLIC_GHL_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_GHL_WEBHOOK_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
